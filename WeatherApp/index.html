<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="content">
        <div class="input-area">
            <input type="search" class="search-bar" placeholder="Greensboro">
            <button class="search-btn">&#128269;</button>
        </div>
        <div class="info-display">
            <p class="date"></p>
            <h1 class="city"></h1>
         <div class="main-weather">  
            <figure class="img-area">
                <img src="" class="weather-img" alt="Clouds">
                <figcaption class="img-label"></figcaption>
            </figure>
         </div>
            
            <h1 class="temp"></h1>

            <div class="high-low-area">
                <div class="high-area">
                    <h4 class="high-label">HIGHS</h4>
                    <p class="high-temp"></p>
                </div>
                <div class="low-area">
                    <h4 class="low-label">LOWS</h4>
                    <p class="low-temp"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
