<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ Accordion</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

    <h2 class="title">Frequently Asked Questions</h2>

    <div class="accordion">

        <div class="item">
            <div class="question">
                <p>What is the return policy?</p>
                <button class="toggle-btn">+</button>
            </div>
            <div class="answer hidden">
                90 day returns, no questions asked.
            </div>
        </div>

        <div class="item">
            <div class="question">
                <p>When will I receive my order?</p>
                <button class="toggle-btn">+</button>
            </div>
            <div class="answer hidden">
                Your order will arrive in 2–5 business days.
            </div>
        </div>

        <div class="item">
            <div class="question">
                <p>Where are you located?</p>
                <button class="toggle-btn">+</button>
            </div>
            <div class="answer hidden">
                We are located in Greensboro, NC at 123 Example Lane.
            </div>
        </div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
