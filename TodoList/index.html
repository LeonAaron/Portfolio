<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="content">
        <div class="add-task-area">
            <input type="text" class="task-input" placeholder="Enter Task..." maxlength="100">
            <button class="add-btn">+</button>
        </div>
        <div class="task-list">
            <!-- EXAMPLE
            <div class="task">
                <h3 class="task-name">Collect Shopping</h3>
                <div class="task-btns">
                    <button class="check-btn">✔</button>
                    <button class="trash-btn">&#128465;</button>
                </div>
            </div>
            -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
